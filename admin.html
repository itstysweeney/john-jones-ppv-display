<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John Jones Display Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header><img src="assets/ppv-black-logo.png" alt=""><div><span>DISPLAY ADMIN</span><h1>Featured Upfits Content</h1></div><a href="leads.html">Event Leads</a><a href="index.html" target="_blank">Open Display</a></header>
  <main>
    <section class="github-publish">
      <div>
        <span>LIVE DISPLAY PUBLISHING</span>
        <h2>GitHub Pages Connection</h2>
        <p>Save changes here and publish them to the video board. The publishing token stays only in this open browser tab. <a href="https://github.com/settings/personal-access-tokens/new?name=John+Jones+PPV+Display&amp;description=Publishes+featured+upfit+display+content&amp;contents=write" target="_blank" rel="noopener">Create publishing token</a></p>
      </div>
      <label>GitHub Username<input id="githubOwner" autocomplete="username" placeholder="Your GitHub username"></label>
      <label>Repository Name<input id="githubRepo" placeholder="john-jones-ppv-display"></label>
      <label>Publishing Token<input id="githubToken" type="password" autocomplete="off" placeholder="Paste token for this session"></label>
    </section>
    <section class="settings">
      <label>Main Heading<input id="heading"></label>
      <label>Small Heading<input id="subheading"></label>
      <label>Slideshow Heading<input id="attractHeading"></label>
      <label>Idle Before Slideshow (seconds)<input id="idleSeconds" type="number" min="5"></label>
      <label>Seconds Per Slide<input id="slideshowSeconds" type="number" min="2"></label>
    </section>
    <div class="editor-heading"><h2>Featured Upfits</h2><button id="addSection">+ Add New Upfit</button></div>
    <section class="editor" id="editor"></section>
    <button class="save" id="saveButton">Save &amp; Publish Display Changes</button>
    <p class="message" id="message"></p>
  </main>
  <script src="content-default.js"></script>
  <script src="admin.js"></script>
</body>
</html>
